<!doctype html>
<html lang="en">
  <body>
    <form
      action="/__forms.html"
      name="schema-lab-suggestions"
      data-netlify="true"
      netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      method="POST"
      hidden
    >
      <input type="hidden" name="form-name" value="schema-lab-suggestions" />
      <input type="hidden" name="subject" value="Schema-Lab suggestion" />
      <input type="text" name="bot-field" />
      <input name="category" />
      <textarea name="message"></textarea>
      <input accept="image/*" name="screenshot" type="file" />
      <button type="submit">Send</button>
    </form>
  </body>
</html>
