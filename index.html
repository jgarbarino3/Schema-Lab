<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schema Lab — Optical Breadboard Editor</title>
    <meta
      name="description"
      content="A free physics-aware optical breadboard editor for ultrafast optics."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Schema Lab" />
    <meta property="og:title" content="Schema Lab — Optical Breadboard Editor" />
    <meta
      property="og:description"
      content="Free optical-table planning with dimensionally accurate components, physics-aware beam tracing, and JSON/SVG import/export."
    />
    <meta property="og:url" content="https://schemalaboratorio.netlify.app/" />
    <meta
      property="og:image"
      content="https://placehold.co/1200x630/png?text=Schema%20Lab%0AFree%20Optical%20Breadboard%20Editor%0ABuilt%20with%20Codex"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Schema Lab, a free optical breadboard editor for ultrafast optics."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Schema Lab — Optical Breadboard Editor" />
    <meta
      name="twitter:description"
      content="A free physics-aware optical breadboard editor for ultrafast optics."
    />
    <meta
      name="twitter:image"
      content="https://placehold.co/1200x630/png?text=Schema%20Lab%0AFree%20Optical%20Breadboard%20Editor%0ABuilt%20with%20Codex"
    />
    <meta
      name="twitter:image:alt"
      content="Schema Lab, a free optical breadboard editor for ultrafast optics."
    />
    <meta name="twitter:creator" content="@GarbarinoJoe" />
  </head>
  <body>
    <div id="root"></div>
    <form
      action="/__forms.html"
      name="schema-lab-suggestions"
      netlify
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      enctype="multipart/form-data"
      method="POST"
      hidden
    >
      <input type="hidden" name="form-name" value="schema-lab-suggestions" />
      <input type="hidden" name="subject" value="Schema-Lab suggestion" />
      <p>
        <label>
          Do not fill this out if you are human:
          <input name="bot-field" />
        </label>
      </p>
      <input name="category" />
      <textarea name="message"></textarea>
      <input accept="image/*" name="screenshot" type="file" />
      <button type="submit">Send</button>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
