<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="350mm"
  height="225mm"
  viewBox="0 0 1400 900"
>
  <g id="layout-frame" inkscape:label="layout-frame">
    <rect
      id="workspace-border"
      x="60"
      y="60"
      width="1280"
      height="780"
      fill="none"
      stroke="#4a5c68"
      stroke-width="2"
    />
  </g>

  <g id="calibration-guides" inkscape:label="calibration-guides" stroke="#7d8f9c" stroke-width="1.4">
    <line id="known-span-50mm" x1="110" y1="820" x2="310" y2="820" />
    <line id="known-span-100mm" x1="1040" y1="120" x2="1440" y2="120" />
  </g>

  <g id="optical-train" transform="translate(90 80)">
    <g id="src-group" inkscape:label="laser source pharos">
      <rect id="laser-source-main" x="30" y="350" width="120" height="62" fill="none" stroke="#9fc4da" stroke-width="2.4" />
      <line id="laser-source-axis" x1="150" y1="381" x2="240" y2="381" stroke="#00ff00" stroke-width="2" />
    </g>

    <g id="mirror-g1" inkscape:label="mirror m1" transform="rotate(41 320 381)">
      <line id="mirror-m1-edge" x1="302" y1="343" x2="338" y2="419" stroke="#d9e8f2" stroke-width="2.2" />
    </g>

    <g id="beamsplitter-g1" inkscape:label="beam splitter bs1" transform="rotate(24 500 381)">
      <rect id="beamsplitter-bs1" x="480" y="361" width="40" height="40" fill="none" stroke="#c5d8e8" stroke-width="2.1" />
    </g>

    <g id="lens-g1" inkscape:label="lens l1">
      <circle id="lens-l1" cx="720" cy="381" r="24" fill="none" stroke="#cce2f2" stroke-width="2.1" />
    </g>

    <g id="filter-g1" inkscape:label="filter bandpass bp1" transform="rotate(-18 860 381)">
      <rect id="filter-bp1" x="836" y="365" width="48" height="32" fill="none" stroke="#b9cede" stroke-width="2" />
    </g>

    <g id="polarizer-g1" inkscape:label="polarizer pol1">
      <circle id="polarizer-pol1" cx="1000" cy="381" r="22" fill="none" stroke="#c2d7e7" stroke-width="2" />
      <line id="polarizer-axis" x1="984" y1="365" x2="1016" y2="397" stroke="#c2d7e7" stroke-width="2" />
    </g>

    <g id="waveplate-g1" inkscape:label="waveplate hwp1" transform="rotate(17 1140 381)">
      <circle id="waveplate-hwp1" cx="1140" cy="381" r="22" fill="none" stroke="#c0d2e1" stroke-width="2" />
      <line id="waveplate-axis" x1="1124" y1="381" x2="1156" y2="381" stroke="#c0d2e1" stroke-width="2" />
    </g>

    <g id="detector-g1" inkscape:label="detector pd1" transform="rotate(-26 1250 515)">
      <polygon id="detector-pd1" points="1228,492 1272,515 1228,538" fill="none" stroke="#b2c6d4" stroke-width="2" />
    </g>

    <g id="sample-stage-g1" inkscape:label="sample stage s1" transform="translate(270 135)">
      <rect id="sample-stage-body" x="280" y="455" width="180" height="74" fill="none" stroke="#a9bece" stroke-width="2.2" />
      <line id="sample-stage-guide" x1="300" y1="492" x2="440" y2="492" stroke="#a9bece" stroke-width="1.7" />
    </g>

    <g id="ambiguous-cluster" transform="translate(90 68)">
      <polygon id="unknown-shape-a" points="540,210 580,166 620,210" fill="none" stroke="#8fa9bc" stroke-width="2" />
      <rect id="unknown-shape-b" x="680" y="166" width="54" height="54" fill="none" stroke="#8fa9bc" stroke-width="2" />
      <ellipse id="unknown-shape-c" cx="830" cy="193" rx="34" ry="19" fill="none" stroke="#8fa9bc" stroke-width="2" />
    </g>

    <g id="beam-lines" stroke="#00ff00" stroke-width="1.4" fill="none">
      <line id="beam-main-1" x1="240" y1="381" x2="480" y2="381" />
      <line id="beam-main-2" x1="520" y1="381" x2="696" y2="381" />
      <line id="beam-main-3" x1="744" y1="381" x2="978" y2="381" />
      <line id="beam-main-4" x1="1022" y1="381" x2="1118" y2="381" />
      <polyline id="beam-branch-a" points="500,401 590,482 650,515" />
      <polyline id="beam-branch-b" points="520,361 660,276 760,242" />
      <polyline id="beam-branch-c" points="890,515 1010,515 1228,515" />
    </g>
  </g>
</svg>
