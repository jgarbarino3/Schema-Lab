<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
  width="1400"
  height="900"
  viewBox="0 0 1400 900"
>
  <g id="layout-frame" inkscape:label="layout-frame">
    <rect
      id="workspace-border"
      x="60"
      y="60"
      width="1280"
      height="780"
      fill="none"
      stroke="#4a5c68"
      stroke-width="2"
    />
  </g>

  <g id="calibration-guides" inkscape:label="calibration-guides" stroke="#7d8f9c" stroke-width="1.4">
    <line id="calibration-span-200mm" x1="110" y1="820" x2="510" y2="820" />
    <line id="calibration-span-100mm" x1="1110" y1="120" x2="1310" y2="120" />
  </g>

  <g id="optical-train" transform="translate(80 70)">
    <g id="src-group" inkscape:label="laser source libra">
      <rect id="laser-source-main" x="40" y="360" width="115" height="58" fill="none" stroke="#9fc4da" stroke-width="2.4" />
      <line id="laser-source-axis" x1="155" y1="389" x2="235" y2="389" stroke="#00ff00" stroke-width="2" />
    </g>

    <g id="mirror-g1" inkscape:label="mirror m1" transform="rotate(38 320 390)">
      <line id="mirror-m1-edge" x1="302" y1="356" x2="338" y2="424" stroke="#d9e8f2" stroke-width="2.2" />
    </g>

    <g id="bs-group" inkscape:label="beam splitter bs1" transform="rotate(27 470 389)">
      <rect id="beamsplitter-bs1" x="452" y="371" width="36" height="36" fill="none" stroke="#c5d8e8" stroke-width="2.1" />
    </g>

    <g id="mirror-g2" inkscape:label="mirror m2" transform="rotate(-44 640 520)">
      <line id="mirror-m2-edge" x1="620" y1="486" x2="660" y2="554" stroke="#d9e8f2" stroke-width="2.2" />
    </g>

    <g id="lens-group-a" inkscape:label="lens l1">
      <circle id="lens-l1-shape" cx="740" cy="389" r="22" fill="none" stroke="#cce2f2" stroke-width="2.1" />
    </g>

    <g id="lens-group-b" inkscape:label="lens l2" transform="rotate(14 910 389)">
      <ellipse id="lens-l2-shape" cx="910" cy="389" rx="24" ry="15" fill="none" stroke="#cce2f2" stroke-width="2.1" />
    </g>

    <g id="pol-group" inkscape:label="polarizer pol1">
      <circle id="polarizer-pol1-ring" cx="1040" cy="389" r="20" fill="none" stroke="#c2d7e7" stroke-width="2" />
      <line id="polarizer-pol1-axis" x1="1026" y1="375" x2="1054" y2="403" stroke="#c2d7e7" stroke-width="2" />
    </g>

    <g id="waveplate-group" inkscape:label="waveplate qwp1" transform="rotate(21 1160 389)">
      <circle id="waveplate-qwp1-ring" cx="1160" cy="389" r="20" fill="none" stroke="#c0d2e1" stroke-width="2" />
      <line id="waveplate-qwp1-axis" x1="1146" y1="389" x2="1174" y2="389" stroke="#c0d2e1" stroke-width="2" />
    </g>

    <g id="filter-group" inkscape:label="filter longpass lp1" transform="rotate(-19 860 520)">
      <rect id="filter-lp1" x="838" y="506" width="44" height="28" fill="none" stroke="#b9cede" stroke-width="2" />
    </g>

    <g id="iris-group" inkscape:label="iris iris1">
      <circle id="iris-outer" cx="990" cy="520" r="20" fill="none" stroke="#b5cad9" stroke-width="2" />
      <circle id="iris-inner" cx="990" cy="520" r="10" fill="none" stroke="#b5cad9" stroke-width="1.5" />
    </g>

    <g id="detector-group" inkscape:label="detector photodiode pd1" transform="rotate(-28 1185 520)">
      <polygon id="detector-pd1" points="1166,498 1208,520 1166,542" fill="none" stroke="#b2c6d4" stroke-width="2" />
    </g>

    <g id="sample-group" inkscape:label="sample stage s1" transform="translate(300 130)">
      <rect id="sample-stage-body" x="260" y="470" width="170" height="70" fill="none" stroke="#a9bece" stroke-width="2.2" />
      <line id="sample-stage-guide" x1="280" y1="505" x2="410" y2="505" stroke="#a9bece" stroke-width="1.7" />
    </g>

    <g id="ambiguous-cluster" transform="translate(120 70)">
      <polygon id="unknown-shape-a" points="540,210 575,170 610,210" fill="none" stroke="#8fa9bc" stroke-width="2" />
      <rect id="unknown-shape-b" x="660" y="170" width="52" height="52" fill="none" stroke="#8fa9bc" stroke-width="2" />
      <ellipse id="unknown-shape-c" cx="800" cy="196" rx="32" ry="18" fill="none" stroke="#8fa9bc" stroke-width="2" />
      <path id="unknown-shape-d" d="M 910 220 L 945 175 L 980 220 L 1015 175" fill="none" stroke="#8fa9bc" stroke-width="2" />
    </g>

    <g id="beam-lines" stroke="#00ff00" stroke-width="1.4" fill="none">
      <line id="beam-main-1" x1="235" y1="389" x2="452" y2="389" />
      <line id="beam-main-2" x1="488" y1="389" x2="718" y2="389" />
      <line id="beam-main-3" x1="762" y1="389" x2="1020" y2="389" />
      <line id="beam-main-4" x1="1060" y1="389" x2="1140" y2="389" />
      <polyline id="beam-branch-a" points="470,407 560,485 620,520" />
      <polyline id="beam-branch-b" points="488,371 620,284 720,250" />
      <polyline id="beam-branch-c" points="882,520 930,520 970,520" />
      <polyline id="beam-branch-d" points="1010,520 1080,520 1160,520" />
    </g>
  </g>

  <g id="hidden-reference" display="none">
    <rect id="hidden-do-not-import" x="200" y="200" width="100" height="100" />
  </g>
</svg>
