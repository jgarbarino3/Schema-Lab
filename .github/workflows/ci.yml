name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle size
        run: npm run bundle:size

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/schema-lab-preview.log 2>&1 &
          echo $! > /tmp/schema-lab-preview.pid

          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/schema-lab-preview.log
          exit 1

      - name: Smoke
        run: npm run smoke:ci

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/schema-lab-preview.pid ]; then
            kill "$(cat /tmp/schema-lab-preview.pid)" || true
          fi

      - name: Upload Playwright output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-output
          path: output/playwright
          if-no-files-found: ignore
